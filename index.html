<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes outils · Bips</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    :root {
      --ink:       #e2e2de;
      --ink-muted: #666662;
      --ink-faint: #3e3e3a;
      --rule:      #2c2c28;
      --gold:      #c8a040;
      --green:     #5c8f60;
      --blue:      #6496c8;
      --bg:        #111110;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 50% at 15% 15%, rgba(200,160,64,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 85% 80%, rgba(100,148,200,0.08) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(92,143,96,0.05) 0%, transparent 70%);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 13px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 24px;
    }
    /* LOADING */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
    }
    .lo-spinner {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(200,160,64,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lo-label { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--ink-muted); }
    #btn-signin-idx {
      display: none;
      background: none; border: 1px solid rgba(200,160,64,0.3);
      color: var(--gold); cursor: pointer;
      font-family: 'Jost', sans-serif; font-size: 11px;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 10px 28px; border-radius: 4px;
      transition: border-color .2s, background .2s;
    }
    #btn-signin-idx:hover { border-color: var(--gold); background: rgba(200,160,64,0.07); }
    /* WRAPPER */
    .wrapper { width: 100%; max-width: 380px; display: flex; flex-direction: column; }
    /* HEADER */
    .site-header { padding-bottom: 36px; border-bottom: 1px solid var(--rule); margin-bottom: 36px; }
    .site-eyebrow { font-size: 9px; letter-spacing: 0.45em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 14px; font-weight: 400; }
    .site-title { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 300; line-height: 1; color: var(--ink); }
    .site-title em { font-style: italic; color: var(--gold); }
    .site-sub { margin-top: 10px; font-size: 11px; color: var(--ink-muted); letter-spacing: 0.05em; }
    /* CARDS */
    .card {
      display: flex; align-items: center; gap: 18px;
      text-decoration: none; padding: 20px 4px;
      border-bottom: 1px solid var(--rule);
      transition: padding-left .2s ease;
    }
    .card:first-child { border-top: 1px solid var(--rule); }
    .card:hover { padding-left: 8px; }
    .card:hover .card-arrow { opacity: 1; transform: translateX(4px); }
    .card-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
      border: 1px solid var(--rule); background: rgba(255,255,255,0.04);
    }
    .card-budget    .card-icon { border-color: rgba(200,160,64,0.25); background: rgba(200,160,64,0.06); }
    .card-habitudes .card-icon { border-color: rgba(92,143,96,0.25);  background: rgba(92,143,96,0.06); }
    .card-calc      .card-icon { border-color: rgba(100,150,200,0.25); background: rgba(100,150,200,0.06); }
    .card-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .card-label { font-size: 14px; font-weight: 400; color: var(--ink); }
    .card-sub { font-size: 10px; color: var(--ink-muted); letter-spacing: 0.05em; }
    .card-arrow { font-size: 14px; color: var(--ink-muted); opacity: 0; transition: opacity .2s, transform .2s; }
    .card-budget    .card-arrow { color: var(--gold); }
    .card-habitudes .card-arrow { color: var(--green); }
    .card-calc      .card-arrow { color: var(--blue); }
    /* FOOTER */
    .site-footer { margin-top: 32px; display: flex; justify-content: space-between; align-items: center; }
    #auth-badge-idx { display: flex; align-items: center; gap: 8px; }
    #auth-badge-idx img { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--rule); }
    #auth-badge-idx span { font-size: 10px; color: var(--ink-muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.05em; }
    #btn-signout-idx { background: none; border: none; cursor: pointer; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; font-family: 'Jost', sans-serif; }
    #btn-signout-idx:hover { color: var(--ink-muted); }
    @media (max-width: 420px) { .site-title { font-size: 38px; } }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="lo-spinner"></div>
  <div class="lo-label">Chargement…</div>
  <button id="btn-signin-idx">Connexion Google</button>
</div>

<div class="wrapper">
  <header class="site-header">
    <div class="site-eyebrow">✦ Espace personnel</div>
    <h1 class="site-title">Mes<br><em>outils.</em></h1>
    <div class="site-sub">Budget · Habitudes · Calculateur DCG</div>
  </header>

  <nav>
    <a href="Budget_5_comptes_1_30_4.html" class="card card-budget">
      <div class="card-icon">📒</div>
      <div class="card-text">
        <span class="card-label">Budget</span>
        <span class="card-sub">Suivi mensuel · Livret A · Assurance Vie</span>
      </div>
      <span class="card-arrow">→</span>
    </a>
    <a href="habitudes_dark.html" class="card card-habitudes">
      <div class="card-icon">✅</div>
      <div class="card-text">
        <span class="card-label">Habitudes</span>
        <span class="card-sub">6 habitudes · 126 jours · tracker quotidien</span>
      </div>
      <span class="card-arrow">→</span>
    </a>
    <a href="calculateur_financier_DCG.html" class="card card-calc">
      <div class="card-icon">🧮</div>
      <div class="card-text">
        <span class="card-label">Calculateur DCG</span>
        <span class="card-sub">Finance · Compta · Fiscal · Outils</span>
      </div>
      <span class="card-arrow">→</span>
    </a>
  </nav>

  <footer class="site-footer">
    <div id="auth-badge-idx"></div>
    <button id="btn-signout-idx" style="display:none">Déconnexion</button>
  </footer>
</div>

<script>
(function() {
  const CFG = {
    apiKey: "AIzaSyBliUUA9lH7DVSyYblSK6G4jFlQDGxanfk",
    authDomain: "budget-58f12.firebaseapp.com",
    projectId: "budget-58f12",
    storageBucket: "budget-58f12.firebasestorage.app",
    messagingSenderId: "327922790999",
    appId: "1:327922790999:web:076a60cf85287d3d38e912"
  };
  const app  = firebase.apps.find(a => a.name === 'idx') || firebase.initializeApp(CFG, 'idx');
  const auth = firebase.auth(app);
  const overlay   = document.getElementById('loading-overlay');
  const btnSignin = document.getElementById('btn-signin-idx');
  const btnSignout= document.getElementById('btn-signout-idx');
  const badge     = document.getElementById('auth-badge-idx');

  auth.onAuthStateChanged(function(user) {
    if (user) {
      overlay.style.display = 'none';
      badge.innerHTML = user.photoURL
        ? '<img src="' + user.photoURL + '" alt=""> <span>' + (user.displayName || user.email) + '</span>'
        : '<span>' + (user.displayName || user.email) + '</span>';
      btnSignout.style.display = 'block';
    } else {
      btnSignin.style.display = 'block';
      btnSignin.onclick = function() {
        btnSignin.style.display = 'none';
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function() {
          btnSignin.style.display = 'block';
        });
      };
    }
  });
  btnSignout.onclick = function() { auth.signOut(); };
})();
</script>
</body>
</html>
