<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Bips</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0e0f12;--surface:#16181d;--border:#272930;--ink:#dddde0;--muted:#7a7d88;--dim:#42454f;--gold:#c9a96e;--gold-d:rgba(201,169,110,.12);--em:#4caf82;--rose:#e07070;--sky:#6aafd6;--r:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;font-size:14px;min-height:100vh;display:flex;flex-direction:column}
button{font-family:'Jost',sans-serif;cursor:pointer}
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.nav-title{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.nav-home{font-size:11px;color:var(--muted);letter-spacing:.05em;padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:none;transition:border-color .2s}
.nav-home:hover{border-color:var(--gold);color:var(--gold)}
.tabs{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid var(--border);background:var(--surface)}
.tab{padding:8px 20px;font-size:12px;letter-spacing:.08em;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:var(--ink)}
.content{flex:1;padding:24px;max-width:920px;width:100%;margin:0 auto}
.tab-panel{display:none}.tab-panel.active{display:block}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px}
.sum-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sum-val{font-family:'DM Mono',monospace;font-size:22px}
.sum-val.pos{color:var(--em)}.sum-val.neg{color:var(--rose)}.sum-val.neu{color:var(--gold)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.list-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.list-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.list-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn-add{width:24px;height:24px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;line-height:1}
.btn-add:hover{border-color:var(--gold);color:var(--gold)}
.list-items{padding:8px}
.item-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;transition:background .15s}
.item-row:hover{background:rgba(255,255,255,.03)}
.item-label{flex:1;background:none;border:none;color:var(--ink);font-family:'Jost',sans-serif;font-size:13px;font-weight:300;outline:none;min-width:0}
.item-val{width:86px;background:none;border:none;font-family:'DM Mono',monospace;font-size:13px;text-align:right;outline:none}
.item-val.rv{color:var(--em)}.item-val.ch{color:var(--rose)}
.item-sfx{font-size:11px;color:var(--dim)}
.btn-del{width:18px;height:18px;border:none;background:none;color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:3px;transition:color .15s,background .15s;line-height:1}
.btn-del:hover{color:var(--rose);background:rgba(224,112,112,.1)}
.list-total{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);font-size:12px;font-family:'DM Mono',monospace;color:var(--muted)}
.list-total strong{color:var(--ink)}
/* Livret A */
.la-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.la-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.la-card:last-child{margin-bottom:0}
.la-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.la-f{margin-bottom:12px}
.la-f label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.la-f input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--ink);font-family:'DM Mono',monospace;font-size:14px;outline:none;transition:border-color .2s}
.la-f input:focus{border-color:var(--gold)}
.bonus-row{display:flex;gap:8px;margin-bottom:10px}
.bonus-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px 10px;color:var(--ink);font-family:'DM Mono',monospace;font-size:13px;outline:none}
.bonus-row input:focus{border-color:var(--gold)}
.btn-bonus{padding:8px 14px;background:none;border:1px solid rgba(201,169,110,.3);border-radius:4px;color:var(--gold);font-size:12px;letter-spacing:.08em;white-space:nowrap;transition:background .2s,border-color .2s}
.btn-bonus:hover{background:var(--gold-d);border-color:var(--gold)}
.bonus-list{margin-top:10px;display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto}
.bonus-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg);border-radius:4px;font-size:12px;font-family:'DM Mono',monospace}
.bonus-item-date{color:var(--muted)}.bonus-item-val{color:var(--em)}
.btn-db{border:none;background:none;color:var(--dim);cursor:pointer;font-size:14px;transition:color .15s}
.btn-db:hover{color:var(--rose)}
.prev-wrap{overflow-x:auto}
.prev-table{width:100%;border-collapse:collapse;font-size:12px}
.prev-table th{text-align:left;padding:8px 12px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);font-weight:400}
.prev-table td{padding:8px 12px;border-bottom:1px solid rgba(39,41,48,.5);font-family:'DM Mono',monospace}
.prev-table tr.cur td{background:rgba(201,169,110,.05)}
.td-m{color:var(--ink)}.td-d{color:var(--sky)}.td-i{color:var(--dim)}.td-s{color:var(--em);font-weight:400}
.empty-bonus{color:var(--dim);font-size:12px;text-align:center;padding:10px}
@media(max-width:640px){.summary,.lists,.la-grid{grid-template-columns:1fr}.content{padding:14px}.top-nav,.tabs{padding-left:16px;padding-right:16px}}
</style>
</head>
<body style="visibility:hidden">
<nav class="top-nav">
  <span class="nav-title">Budget · Bips</span>
  <button class="nav-home" onclick="location.href='index.html'">← Accueil</button>
</nav>
<div class="tabs">
  <button class="tab active" onclick="switchTab('budget',this)">Vue générale</button>
  <button class="tab" onclick="switchTab('livreta',this)">📈 Livret A</button>
</div>
<div class="content">
  <div id="tab-budget" class="tab-panel active">
    <div class="summary">
      <div class="sum-card"><div class="sum-label">Revenus</div><div class="sum-val pos" id="s-rev">—</div></div>
      <div class="sum-card"><div class="sum-label">Charges</div><div class="sum-val neg" id="s-cha">—</div></div>
      <div class="sum-card"><div class="sum-label">Net disponible</div><div class="sum-val neu" id="s-net">—</div></div>
    </div>
    <div class="lists">
      <div class="list-box">
        <div class="list-header"><span class="list-title">Revenus</span><button class="btn-add" onclick="addItem('rev')">+</button></div>
        <div class="list-items" id="list-rev"></div>
        <div class="list-total"><span>Total</span><strong id="tot-rev">0 €</strong></div>
      </div>
      <div class="list-box">
        <div class="list-header"><span class="list-title">Charges</span><button class="btn-add" onclick="addItem('cha')">+</button></div>
        <div class="list-items" id="list-cha"></div>
        <div class="list-total"><span>Total</span><strong id="tot-cha">0 €</strong></div>
      </div>
    </div>
  </div>
  <div id="tab-livreta" class="tab-panel">
    <div class="la-grid">
      <div>
        <div class="la-card">
          <div class="la-title">Configuration</div>
          <div class="la-f"><label>Solde actuel (€)</label><input type="number" id="la-solde" value="0" onchange="laSync();renderPrev();save()"></div>
          <div class="la-f"><label>Dépôt mensuel de base (€)</label><input type="number" id="la-mens" value="250" onchange="laSync();renderPrev();save()"></div>
          <div class="la-f"><label>Taux annuel (%)</label><input type="number" id="la-taux" value="3" step="0.1" onchange="laSync();renderPrev();save()"></div>
        </div>
        <div class="la-card">
          <div class="la-title">Virements bonus</div>
          <div class="bonus-row">
            <input type="date" id="la-bd">
            <input type="number" id="la-bm" placeholder="Montant €" min="0">
            <button class="btn-bonus" onclick="addBonus()">+ Ajouter</button>
          </div>
          <div class="bonus-list" id="bl"></div>
        </div>
      </div>
      <div class="la-card" style="margin-bottom:0">
        <div class="la-title">Prévisionnel — 12 mois</div>
        <div class="prev-wrap">
          <table class="prev-table">
            <thead><tr><th>Mois</th><th>Dépôt</th><th>Intérêts</th><th>Solde fin</th></tr></thead>
            <tbody id="pt"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const FB={apiKey:'AIzaSyBliUUA9lH7DVSyYblSK6G4jFlQDGxanfk',authDomain:'budget-58f12.firebaseapp.com',projectId:'budget-58f12',storageBucket:'budget-58f12.firebasestorage.app',messagingSenderId:'327922790999',appId:'1:327922790999:web:076a60cf85287d3d38e912'};
const ALLOWED='baps.renard@gmail.com',SK='bips_budget_v1';
let _db=null,_uid=null;
if(!firebase.apps.length)firebase.initializeApp(FB);
firebase.auth().getRedirectResult().catch(()=>{});
firebase.auth().onAuthStateChanged(user=>{
  if(!user||user.email.toLowerCase()!==ALLOWED){window.location.replace('index.html');return;}
  _uid=user.uid;_db=firebase.firestore();
  document.body.style.visibility='visible';
  loadData();
});
function dbSave(){if(!_db||!_uid)return;_db.collection('users').doc(_uid).collection('data').doc(SK).set({value:JSON.stringify(STATE)}).catch(console.warn);localStorage.setItem(SK,JSON.stringify(STATE));}
async function dbLoad(){if(!_db||!_uid)return null;try{const s=await _db.collection('users').doc(_uid).collection('data').doc(SK).get();return s.exists?s.data().value:null;}catch(e){return null;}}
const DS={rev:[{id:'r1',l:'Salaire net',v:1815.20},{id:'r2',l:'Tickets restaurant (face)',v:117.00}],cha:[{id:'c1',l:'Loyer',v:821.95},{id:'c2',l:'EDF / Électricité',v:68.91},{id:'c3',l:'Assurance AXA',v:69.00},{id:'c4',l:'Mutuelle',v:24.00},{id:'c5',l:'Internet Orange',v:24.99},{id:'c6',l:'Téléphone',v:20.00},{id:'c7',l:'Transport (TC Monaco)',v:87.00},{id:'c8',l:'Apple One',v:45.52},{id:'c9',l:'Netflix',v:4.71},{id:'c10',l:'Spotify',v:6.99},{id:'c11',l:'ChatGPT Plus',v:16.99},{id:'c12',l:'Assurance Vie',v:83.28},{id:'c13',l:'Livret A (virement)',v:280.00}],la:{solde:0,mens:250,taux:3,bonus:[]}};
let STATE=JSON.parse(JSON.stringify(DS));
async function loadData(){const raw=await dbLoad();if(raw){try{const s=JSON.parse(raw);if(s.rev)STATE.rev=s.rev;if(s.cha)STATE.cha=s.cha;if(s.la)STATE.la=s.la;}catch(e){}}else{const l=localStorage.getItem(SK);if(l){try{const s=JSON.parse(l);if(s.rev)STATE.rev=s.rev;if(s.cha)STATE.cha=s.cha;if(s.la)STATE.la=s.la;}catch(e){}}}renderAll();}
const fmt=n=>Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=n=>fmt(n)+' €';
function renderList(t){
  const items=STATE[t],c=document.getElementById('list-'+t),isR=t==='rev';
  c.innerHTML='';
  items.forEach((it,i)=>{
    const row=document.createElement('div');row.className='item-row';
    row.innerHTML=`<input class="item-label" value="${it.l||''}" placeholder="Libellé" onchange="STATE['${t}'][${i}].l=this.value;save()"><input class="item-val ${isR?'rv':'ch'}" type="number" value="${it.v||0}" step="0.01" onchange="STATE['${t}'][${i}].v=parseFloat(this.value)||0;renderSummary();save()"><span class="item-sfx">€</span><button class="btn-del" onclick="delItem('${t}',${i})">×</button>`;
    c.appendChild(row);
  });
  renderSummary();
}
function renderSummary(){const tR=STATE.rev.reduce((s,i)=>s+(parseFloat(i.v)||0),0),tC=STATE.cha.reduce((s,i)=>s+(parseFloat(i.v)||0),0),n=tR-tC;document.getElementById('s-rev').textContent=eur(tR);document.getElementById('s-cha').textContent=eur(tC);document.getElementById('s-net').textContent=eur(n);document.getElementById('s-net').className='sum-val '+(n>=0?'neu':'neg');document.getElementById('tot-rev').textContent=eur(tR);document.getElementById('tot-cha').textContent=eur(tC);}
function addItem(t){STATE[t].push({id:t+Date.now(),l:'Nouveau',v:0});renderList(t);save();}
function delItem(t,i){STATE[t].splice(i,1);renderList(t);save();}
function laSync(){STATE.la.solde=parseFloat(document.getElementById('la-solde').value)||0;STATE.la.mens=parseFloat(document.getElementById('la-mens').value)||250;STATE.la.taux=parseFloat(document.getElementById('la-taux').value)||3;}
function renderLaConfig(){document.getElementById('la-solde').value=STATE.la.solde;document.getElementById('la-mens').value=STATE.la.mens;document.getElementById('la-taux').value=STATE.la.taux;renderBonusList();renderPrev();}
function addBonus(){const d=document.getElementById('la-bd').value,m=parseFloat(document.getElementById('la-bm').value);if(!d||!m||m<=0)return;STATE.la.bonus.push({date:d,montant:m});STATE.la.bonus.sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('la-bd').value='';document.getElementById('la-bm').value='';renderBonusList();renderPrev();save();}
function delBonus(i){STATE.la.bonus.splice(i,1);renderBonusList();renderPrev();save();}
function renderBonusList(){const bl=document.getElementById('bl');if(!STATE.la.bonus.length){bl.innerHTML='<div class="empty-bonus">Aucun virement bonus enregistré</div>';return;}bl.innerHTML=STATE.la.bonus.map((b,i)=>`<div class="bonus-item"><span class="bonus-item-date">${b.date}</span><span class="bonus-item-val">+${fmt(b.montant)} €</span><button class="btn-db" onclick="delBonus(${i})">×</button></div>`).join('');}
function renderPrev(){const tb=document.getElementById('pt');const now=new Date();const curKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;const tm=(STATE.la.taux/100)/12;let solde=STATE.la.solde;const M=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];let y=now.getFullYear(),m=now.getMonth();let rows='';for(let i=0;i<12;i++){const key=`${y}-${String(m+1).padStart(2,'0')}`;const bonus=STATE.la.bonus.filter(b=>b.date.startsWith(key)).reduce((s,b)=>s+b.montant,0);const dep=STATE.la.mens+bonus;const int=(solde+dep)*tm;solde+=dep+int;rows+=`<tr class="${key===curKey?'cur':''}"><td class="td-m">${M[m]} ${y}${key===curKey?' ◈':''}</td><td class="td-d">+${fmt(dep)}</td><td class="td-i">+${int.toFixed(2)}</td><td class="td-s">${fmt(solde)} €</td></tr>`;m++;if(m>11){m=0;y++;}}}
function switchTab(id,btn){document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');if(id==='livreta')renderLaConfig();}
let _st;function save(){clearTimeout(_st);_st=setTimeout(dbSave,800);}
function renderAll(){renderList('rev');renderList('cha');renderSummary();}
</script>
</body>
</html>
